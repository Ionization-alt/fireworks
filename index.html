<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realistic Fireworks</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#03030a;--fg:#f2efe8;--muted:#8d8a99}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03030a;--fg:#f2efe8;--muted:#8d8a99}}
:root[data-theme="dark"]{--bg:#03030a;--fg:#f2efe8;--muted:#8d8a99}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
p{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);left:0;right:0;margin:0;text-align:center;font:13px system-ui,sans-serif;color:var(--muted);pointer-events:none;z-index:2}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>Tap or click to launch your own</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let parts=[],rockets=[],flashes=[];

let SK=1;
function spark(x,y,vx,vy,hue,o={}){
  parts.push({x,y,vx:vx*SK,vy:vy*SK,hue,sat:o.sat??90,light:o.light??62,life:o.life??1,max:o.life??1,
    size:o.size??1.6,drag:o.drag??.985,grav:o.grav??.035,twinkle:o.twinkle||false});
}

function burst(x,y){
  const type=pick(['sphere','sphere','ring','double','willow','multi','heart','sphere']);
  const hue=rnd(0,360), n=type==='willow'?140:110;
  SK=Math.max(.9,Math.min(1.7,Math.min(W,H)/520));
  flashes.push({x,y,hue,a:.35,r:rnd(120,200)});
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, life=rnd(1.1,1.9);
    if(type==='sphere'){
      const s=rnd(.5,5.2),b=rnd(0,Math.PI*2);
      spark(x,y,Math.cos(b)*s,Math.sin(b)*s,hue+rnd(-12,12),{life,twinkle:Math.random()<.4});
    }else if(type==='ring'){
      spark(x,y,Math.cos(a)*4.4,Math.sin(a)*4.4,hue,{life:1.5,drag:.978});
    }else if(type==='double'){
      const s=i%2?2.6:4.8;
      spark(x,y,Math.cos(a)*s,Math.sin(a)*s,hue+(i%2?150:0),{life:1.5,drag:.978});
    }else if(type==='willow'){
      const s=rnd(.5,4.2),b=rnd(0,Math.PI*2);
      spark(x,y,Math.cos(b)*s,Math.sin(b)*s,42,{life:rnd(2.2,3.2),drag:.97,grav:.05,sat:95,light:60,size:1.3,twinkle:true});
    }else if(type==='multi'){
      const s=rnd(1,5),b=rnd(0,Math.PI*2);
      spark(x,y,Math.cos(b)*s,Math.sin(b)*s,rnd(0,360),{life});
    }else{
      const t=a,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      spark(x,y,hx*.28,hy*.28,345,{life:1.6,drag:.98,sat:95});
    }
  }
  SK=1;
}

function launch(tx,ty){
  const x=tx??rnd(W*.15,W*.85), y=ty??(()=>{const q=Math.random();return q<.5?rnd(H*.02,H*.28):q<.68?rnd(H*.28,H*.55):rnd(H*.58,H*.88)})();
  const sx=tx!=null?W/2+(tx-W/2)*.3:x;
  rockets.push({x:sx,y:H+10,tx:x,ty:y,vy:-(H-y)*.0175,hue:rnd(30,60)});
}

let last=performance.now(),next=0;
function frame(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  if(t>next){const k=Math.random()<.3?2:1;for(let i=0;i<k;i++)launch();next=t+rnd(350,800)}

  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.x+=(r.tx-r.x)*.03*dt;r.y+=r.vy*dt;r.vy*=.985;
    spark(r.x,r.y,rnd(-.3,.3),rnd(.3,1.2),r.hue,{life:.45,size:1.2,sat:80,light:70,grav:.02});
    ctx.fillStyle='hsl('+r.hue+',100%,85%)';ctx.beginPath();ctx.arc(r.x,r.y,2,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>-.4){burst(r.x,r.y);rockets.splice(i,1)}
  }

  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i],g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,'hsla('+f.hue+',90%,70%,'+f.a+')');g.addColorStop(1,'hsla('+f.hue+',90%,50%,0)');
    ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2);
    f.a-=.025*dt;if(f.a<=0)flashes.splice(i,1);
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vx*=Math.pow(p.drag,dt);p.vy*=Math.pow(p.drag,dt);p.vy+=p.grav*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.016*dt;
    if(p.life<=0){parts.splice(i,1);continue}
    let a=p.life/p.max;if(p.twinkle&&Math.random()<.3)a*=.3;
    ctx.fillStyle='hsla('+p.hue+','+p.sat+'%,'+p.light+'%,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.5+a*.5),0,7);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>launch(e.clientX,e.clientY));
</script>
</body>
</html>
